<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="160" y1="140" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Circle / Rounded Square for Twitter Avatar -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="url(#shieldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Shield -->
  <path
    d="M256 72L400 132V244C400 342.5 338.6 427.8 256 456C173.4 427.8 112 342.5 112 244V132L256 72Z"
    fill="url(#innerGlow)"
    stroke="url(#shieldGrad)"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Inner Hexagon / Chain Node Accent -->
  <path
    d="M256 124L352 164V242C352 312 311 372 256 396C201 372 160 312 160 242V164L256 124Z"
    stroke="#34D399"
    stroke-width="4"
    stroke-dasharray="10 8"
    stroke-opacity="0.5"
  />

  <!-- Verification Checkmark + Chain Link Symbol -->
  <path
    d="M198 258L238 298L322 210"
    stroke="#10B981"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top & Corner QR / Blockchain Nodes -->
  <circle cx="256" cy="72" r="12" fill="#818CF8" />
  <circle cx="400" cy="132" r="10" fill="#6366F1" />
  <circle cx="112" cy="132" r="10" fill="#6366F1" />
  <circle cx="256" cy="456" r="12" fill="#10B981" />
</svg>
